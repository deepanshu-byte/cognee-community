name: Hugging Face connector tests

on:
  pull_request:
    paths:
      - "packages/connector/huggingface/**"
      - ".github/workflows/test_huggingface.yml"
  push:
    branches: [main]
    paths:
      - "packages/connector/huggingface/**"
      - ".github/workflows/test_huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv sync --frozen --python 3.11
        working-directory: packages/connector/huggingface
      - run: uv run --frozen pytest tests/ -q
        working-directory: packages/connector/huggingface
      - run: uv run --frozen ruff check .
        working-directory: packages/connector/huggingface
      - run: uv run --frozen ruff format --check .
        working-directory: packages/connector/huggingface
