[project]
name = "cognee-community-connector-huggingface"
version = "0.1.0"
description = "Hugging Face cards and discussions for cognee with incremental sync and deletion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "huggingface-hub>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_huggingface"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]
